name: Manter o Supabase ativo
# O Cron do Worker já lê o banco a cada 15 min. Este workflow é uma segunda garantia (diária),
# independente da Cloudflare: o projeto gratuito do Supabase pausa após 7 dias sem atividade.
on:
  schedule:
    - cron: '17 9 * * *' # UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leitura no banco
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then curl -fsS "$APP_URL/health/db" && echo; fi
          if [ -n "$DATABASE_URL" ]; then psql "$DATABASE_URL" -tAc "select note from health_check where id = 1"; fi
