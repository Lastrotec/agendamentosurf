name: Deploy (Cloudflare Workers + Supabase)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: outside_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outside_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Account ID é opcional: com um token de uma conta só, o wrangler descobre sozinho.
      - name: Conta da Cloudflare
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Conferir segredos
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Falta o segredo CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${{ secrets.SUPABASE_DIRECT_URL }}" ] || { echo "::error::Falta o segredo SUPABASE_DIRECT_URL"; exit 1; }
          [ -n "${{ secrets.ADMIN_PASSWORD }}" ] || echo "::warning::Falta o segredo ADMIN_PASSWORD (acesso do instrutor)"
      # Migrações aditivas + dados iniciais (idempotentes), pela conexão direta do Supabase.
      - name: Migrações e dados iniciais
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npm run db:seed
      # Hyperdrive: o Worker precisa dele para falar com o Supabase. Cria na primeira vez e reaproveita depois.
      - name: Hyperdrive
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          ID=$(npx wrangler hyperdrive list 2>/dev/null | grep -E 'outside-db' | grep -oE '[0-9a-f]{32}' | head -1 || true)
          if [ -z "$ID" ]; then
            npx wrangler hyperdrive create outside-db --connection-string="${SUPABASE_POOLER_URL:-$SUPABASE_DIRECT_URL}" | tee /tmp/hd.txt
            ID=$(grep -oE '[0-9a-f]{32}' /tmp/hd.txt | head -1)
          fi
          [ -n "$ID" ] || { echo "::error::Não foi possível criar/encontrar o Hyperdrive (o token precisa de Account → Hyperdrive → Edit)"; exit 1; }
          sed -i "s#// \"hyperdrive\": \[{ \"binding\": \"HYPERDRIVE\", \"id\": \"COLE_O_ID_AQUI\" }\],#\"hyperdrive\": [{ \"binding\": \"HYPERDRIVE\", \"id\": \"$ID\" }],#" wrangler.jsonc
          grep -q "\"id\": \"$ID\"" wrangler.jsonc
      - run: npm run build
      # Conta nova na Cloudflare: registra o endereço <nome>.workers.dev na primeira vez (uma vez por conta).
      - name: Subdomínio workers.dev
        run: |
          ACC="${CLOUDFLARE_ACCOUNT_ID:-$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result[0]?.id??""))')}"
          CUR=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain??"")}catch{console.log("")}})')
          if [ -n "$CUR" ]; then echo "Subdomínio: $CUR.workers.dev"; exit 0; fi
          for NAME in outsidesurf outside-surf-school outsidesurf-ssa; do
            R=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$NAME\"}" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
            if echo "$R" | grep -q '"success":true'; then echo "Registrado: $NAME.workers.dev"; exit 0; fi
            if echo "$R" | grep -q '10036'; then echo "A conta já tem subdomínio workers.dev."; exit 0; fi
            echo "$R" | head -c 300; echo
          done
          echo "::error::Não foi possível registrar o subdomínio workers.dev. Registre em dash.cloudflare.com → Workers & Pages."; exit 1
      - name: Publicar Worker
        run: npx wrangler deploy --message "deploy ${GITHUB_SHA::7}"
      # Segredos do Worker: usa os do GitHub quando existirem; senão gera na primeira publicação
      # (chave de criptografia, sal e chaves das notificações) e não mexe mais nos que já estão lá.
      - name: Segredos do Worker
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_ORIGIN: ${{ vars.APP_URL }}
        run: |
          npx wrangler secret list --format json > /tmp/existing.json 2>/dev/null || echo '[]' > /tmp/existing.json
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { randomBytes, webcrypto } from "node:crypto";
            const have = new Set(JSON.parse(readFileSync("/tmp/existing.json", "utf8") || "[]").map((s) => s.name));
            const out = {};
            const want = async (k, make) => {
              if (process.env[k]) out[k] = process.env[k];
              else if (!have.has(k) && make) out[k] = await make();
            };
            await want("DATA_ENCRYPTION_KEY", () => randomBytes(32).toString("base64url"));
            await want("RATE_LIMIT_SALT", () => randomBytes(24).toString("base64url"));
            await want("VAPID_PRIVATE_JWK", async () => {
              const kp = await webcrypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign"]);
              const { kty, crv, x, y, d } = await webcrypto.subtle.exportKey("jwk", kp.privateKey);
              return JSON.stringify({ kty, crv, x, y, d });
            });
            await want("VAPID_SUBJECT", () => "mailto:contato@outsidesurf.com.br");
            await want("APP_ORIGIN");
            writeFileSync("/tmp/secrets.json", JSON.stringify(out));
            console.log("Segredos enviados:", Object.keys(out).join(", ") || "nenhum (já configurados)");
          '
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json /tmp/existing.json
      # Acesso do instrutor: criado só se ainda não existir nenhum (nunca sobrescreve a senha trocada no painel).
      - name: Acesso do instrutor (primeira vez)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then echo "::warning::Sem ADMIN_PASSWORD: acesso do instrutor não criado"; exit 0; fi
          N=$(node --input-type=module -e 'import postgres from "postgres"; const sql = postgres(process.env.DATABASE_URL, { max: 1 }); const [r] = await sql`select count(*)::int as n from admins`; console.log(r.n); await sql.end();')
          if [ "$N" = "0" ]; then npm run admin:create -- --email "${ADMIN_EMAIL:-romario@outsidesurf.com.br}" --name "Romário de Jesus"; else echo "Instrutor já cadastrado."; fi
      - name: Validar produção
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::Defina a variável APP_URL para validar o deploy"; exit 0; fi
          for i in 1 2 3 4 5; do curl -fsS "$APP_URL/health" && break; sleep 5; done
          curl -fsS "$APP_URL/health/db"
          curl -fsS "$APP_URL/api/public/bootstrap" | grep -q '"config"'
