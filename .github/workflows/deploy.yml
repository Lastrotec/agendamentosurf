name: Deploy (Cloudflare Workers)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: toni_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/toni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Migrações antes do deploy (aditivas). Usa conexão direta/sessão do Supabase.
      - name: Migrações do banco
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::SUPABASE_DIRECT_URL não configurado — migrações ignoradas"; else npm run db:migrate; fi
      - run: npm run build
      - name: Publicar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "deploy ${GITHUB_SHA::7}"
      - name: Validar produção (/health e página inicial)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::Defina a variável APP_URL para validar o deploy"; exit 0; fi
          for i in 1 2 3 4 5; do curl -fsS "$APP_URL/health" && break; sleep 5; done
          curl -fsS "$APP_URL/" | grep -q 'data-theme='
          curl -fsS "$APP_URL/api/public/bootstrap" | grep -q '"business"'
