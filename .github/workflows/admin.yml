name: Criar/atualizar acesso do instrutor
# Rode manualmente (Actions → este workflow → Run). Usa os segredos ADMIN_EMAIL e ADMIN_PASSWORD.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run admin:create -- --email "${{ secrets.ADMIN_EMAIL }}" --name "Romário de Jesus"
